openapi: 3.1.0
info:
  title: Small Town Veggies Dashboard API
  version: 0.2.0-draft
  description: >-
    Protected dashboard API foundation. Production storage adapters, live
    mutations, and customer messaging remain disabled until separately approved.
servers:
  - url: /
    description: Same-origin Vercel deployment.
security:
  - administratorSession: []
tags:
  - name: System
  - name: Authentication
  - name: Orders
  - name: Customers
  - name: Products
  - name: Messaging
paths:
  /api/health:
    get:
      tags: [System]
      summary: Read non-secret backend readiness state
      security: []
      responses:
        '200':
          description: Backend process is reachable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Create a revocable administrator session
      security: []
      parameters:
        - $ref: '#/components/parameters/MutationMarker'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        '200':
          description: Session cookie created and CSRF token returned.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/session:
    get:
      tags: [Authentication]
      summary: Validate the current administrator session
      responses:
        '200':
          description: Active session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current administrator session
      parameters:
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Session revoked and cookie expired.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [authenticated]
                    properties:
                      authenticated:
                        type: boolean
                        const: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Orders visible to the authenticated administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/{id}/confirm:
    post:
      tags: [Orders]
      summary: Move a pending order to confirmed
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/OrderMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/{id}/ready:
    post:
      tags: [Orders]
      summary: Move a confirmed order to ready
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/OrderMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/orders/{id}/pickup:
    post:
      tags: [Orders]
      summary: Move a ready order to picked up
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/OrderMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/customers:
    get:
      tags: [Customers]
      summary: List customers and current messaging consent
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Customers visible to the authenticated administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Product collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Products]
      summary: Create a product
      parameters:
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/broadcasts:
    post:
      tags: [Messaging]
      summary: Customer broadcast endpoint
      description: Always disabled in this foundation stage.
      parameters:
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '503':
          $ref: '#/components/responses/MessagingDisabled'
  /api/reminders:
    post:
      tags: [Messaging]
      summary: Pickup reminder endpoint
      description: Always disabled in this foundation stage.
      parameters:
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '503':
          $ref: '#/components/responses/MessagingDisabled'
components:
  securitySchemes:
    administratorSession:
      type: apiKey
      in: cookie
      name: stv_admin_session
      description: Signed HttpOnly cookie backed by a revocable server-side session.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
          - type: string
            minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    MutationMarker:
      name: X-Small-Town-Veggies-Request
      in: header
      required: true
      schema:
        type: string
        const: dashboard
      description: Non-secret browser preflight marker.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 20
      description: Token bound to the active administrator session.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Unique key that makes business mutations replay safe.
  responses:
    OrderMutationSuccess:
      description: Updated order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderResponse'
    Unauthorized:
      description: No active administrator session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Origin, Fetch Metadata, mutation marker, CSRF, or authorization check failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested record was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Invalid state transition or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Request fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required durable production adapter is not connected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MessagingDisabled:
      description: Customer messaging remains disconnected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Identifier:
      oneOf:
        - type: integer
        - type: string
          minLength: 1
    HealthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [status, configured, database, session_store, live_mutations, messaging]
          properties:
            status:
              type: string
              const: ok
            configured:
              type: boolean
            database:
              type: string
              const: not_connected
            session_store:
              type: string
              const: not_connected
            live_mutations:
              type: boolean
              const: false
            messaging:
              type: string
              const: disabled
    SessionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [authenticated, csrf_token, expires_at]
          properties:
            authenticated:
              type: boolean
              const: true
            csrf_token:
              type: string
              minLength: 20
            expires_at:
              type: string
              format: date-time
    OrderStatus:
      type: string
      enum: [pending, confirmed, ready, picked_up]
    Order:
      type: object
      additionalProperties: true
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        customer_name:
          type: string
          maxLength: 120
        pickup_day:
          type: string
          maxLength: 40
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          type: number
          minimum: 0
        created_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Customer:
      type: object
      additionalProperties: true
      required: [id, opted_in]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40
        opted_in:
          type: boolean
        created_at:
          oneOf:
            - type: string
              format: date
            - type: string
              format: date-time
        consent_updated_at:
          type: string
          format: date-time
        consent_source:
          type: string
          enum: [web, sms, paper, staff, unknown]
    Product:
      type: object
      additionalProperties: true
      required: [id, name, price, unit, active]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 80
        price:
          type: number
          minimum: 0
          maximum: 10000
        unit:
          type: string
          minLength: 1
          maxLength: 40
        active:
          type: boolean
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, price, unit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        price:
          type: number
          minimum: 0
          maximum: 10000
        unit:
          type: string
          minLength: 1
          maxLength: 40
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [message, code, request_id]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 300
        code:
          type: string
          minLength: 1
          maxLength: 100
        field_errors:
          type: object
          additionalProperties:
            type: string
        request_id:
          type: string
          format: uuid
    PageMeta:
      type: object
      additionalProperties: false
      required: [next_cursor, count]
      properties:
        next_cursor:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        count:
          type: integer
          minimum: 0
    OrderCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CustomerCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ProductCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PageMeta'
    OrderResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Order'
    ProductResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Product'
