openapi: 3.1.0
info:
  title: Small Town Veggies Dashboard API
  version: 0.1.0-draft
  description: >-
    Draft contract for the protected Small Town Veggies operations dashboard.
    Live mutations and customer messaging must remain disabled until the
    production acceptance gates in docs/API_CONTRACT.md are satisfied.
servers:
  - url: https://your-backend.example.com
    description: Replace with the reviewed protected backend origin.
security:
  - administratorSession: []
tags:
  - name: Orders
  - name: Customers
  - name: Products
  - name: Messaging
paths:
  /api/orders:
    get:
      tags: [Orders]
      summary: List orders
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Orders visible to the authenticated administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/orders/{id}/confirm:
    post:
      tags: [Orders]
      summary: Move a pending order to confirmed
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/OrderMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/orders/{id}/ready:
    post:
      tags: [Orders]
      summary: Move a confirmed order to ready
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/OrderMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/orders/{id}/pickup:
    post:
      tags: [Orders]
      summary: Move a ready order to picked up
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          $ref: '#/components/responses/OrderMutationSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/customers:
    get:
      tags: [Customers]
      summary: List customers and current messaging consent
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Customers visible to the authenticated administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Product collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Products]
      summary: Create a product
      parameters:
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/broadcasts:
    post:
      tags: [Messaging]
      summary: Submit an opted-in customer broadcast
      description: Disabled until the protected messaging acceptance gates pass.
      x-production-gate: disabled
      parameters:
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastRequest'
      responses:
        '202':
          description: Broadcast accepted for protected server-side processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/reminders:
    post:
      tags: [Messaging]
      summary: Submit pickup reminders for eligible orders
      description: Disabled until the protected messaging acceptance gates pass.
      x-production-gate: disabled
      parameters:
        - $ref: '#/components/parameters/MutationMarker'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReminderRequest'
      responses:
        '202':
          description: Reminder job accepted for protected server-side processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    administratorSession:
      type: apiKey
      in: cookie
      name: stv_admin_session
      description: Secure HttpOnly administrator session cookie.
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        oneOf:
          - type: integer
          - type: string
            minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
    MutationMarker:
      name: X-Small-Town-Veggies-Request
      in: header
      required: true
      schema:
        type: string
        const: dashboard
      description: Non-secret custom header used with origin and CSRF protections.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Must become required before production live mutations are enabled.
  responses:
    OrderMutationSuccess:
      description: Updated order.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OrderResponse'
    Unauthorized:
      description: No valid administrator session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated administrator lacks permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested record was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Invalid state transition, duplicate operation, or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Request fields failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Identifier:
      oneOf:
        - type: integer
        - type: string
          minLength: 1
    OrderStatus:
      type: string
      enum: [pending, confirmed, ready, picked_up]
    Order:
      type: object
      additionalProperties: true
      required: [id, status]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        customer_name:
          type: string
          maxLength: 120
        pickup_day:
          type: string
          maxLength: 40
        status:
          $ref: '#/components/schemas/OrderStatus'
        total:
          type: number
          minimum: 0
        created_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Customer:
      type: object
      additionalProperties: true
      required: [id, opted_in]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 40
        opted_in:
          type: boolean
        created_at:
          oneOf:
            - type: string
              format: date
            - type: string
              format: date-time
        consent_updated_at:
          type: string
          format: date-time
        consent_source:
          type: string
          enum: [web, sms, paper, staff, unknown]
    Product:
      type: object
      additionalProperties: true
      required: [id, name, price, unit, active]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        name:
          type: string
          minLength: 1
          maxLength: 80
        price:
          type: number
          minimum: 0
          maximum: 10000
        unit:
          type: string
          minLength: 1
          maxLength: 40
        active:
          type: boolean
    CreateProductRequest:
      type: object
      additionalProperties: false
      required: [name, price, unit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        price:
          type: number
          minimum: 0
          maximum: 10000
        unit:
          type: string
          minLength: 1
          maxLength: 40
    BroadcastRequest:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 320
    ReminderRequest:
      type: object
      additionalProperties: false
      required: [order_ids]
      properties:
        order_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Identifier'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [message, code]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 300
        code:
          type: string
          minLength: 1
          maxLength: 100
        field_errors:
          type: object
          additionalProperties:
            type: string
        request_id:
          type: string
    PageMeta:
      type: object
      additionalProperties: false
      required: [next_cursor, count]
      properties:
        next_cursor:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        count:
          type: integer
          minimum: 0
    OrderCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CustomerCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ProductCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PageMeta'
    OrderResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Order'
    ProductResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Product'
    MessageJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [job_id, accepted_count]
          properties:
            job_id:
              type: string
              minLength: 1
            accepted_count:
              type: integer
              minimum: 0
