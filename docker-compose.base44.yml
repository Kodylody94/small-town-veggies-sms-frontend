services:
  api:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - APP_ORIGIN=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      - PORT=3001
    command: node api/dev-server.mjs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:5173"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: sh -c "npm install && npm run dev"
    depends_on:
      api:
        condition: service_healthy
