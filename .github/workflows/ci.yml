name: Frontend CI

on:
  push:
    branches: [main, build/frontend-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Commit dependency lock
        if: github.event_name == 'push' && github.ref_name == 'build/frontend-foundation'
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add reproducible dependency lock"
          git push origin HEAD:build/frontend-foundation
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-output
          path: |
            lint.log
            test.log
          if-no-files-found: error
          retention-days: 1
      - name: Build
        run: npm run build
      - name: Fail on verification errors
        if: steps.lint.outcome == 'failure' || steps.test.outcome == 'failure'
        run: exit 1
