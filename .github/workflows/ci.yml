name: Frontend and Backend CI

on:
  push:
    branches: [main, build/frontend-foundation, build/backend-foundation]
  pull_request:
    branches: [main, build/frontend-foundation]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Unit and backend contract tests
        run: npm test
      - name: Build
        run: npm run build

  browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Chromium test runtime
        run: npx --yes @playwright/test@1.55.0 install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
